<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IteraMath U2</title>
</head>
<body>
    <header class="main-header">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div class="logo">IteraMath U2</div>
            <span id="offline-indicator" class="badge badge-warning hidden" role="status">Sin conexión</span>
        </div>
        <nav>
            <a href="#" id="nav-resolver" class="active">Resolver</a>
            <a href="#" id="nav-compare">Comparar</a>
            <a href="#" id="nav-history">Historial</a>
        </nav>
    </header>

    <main id="view-resolver" class="view-container active layout-split">
        <aside class="panel-left">
            <form id="resolver-form">
                <div class="panel-left-header">
                    <h2>Configuración</h2>
                    <span class="panel-header-badge">Unidad 2</span>
                </div>
                <div class="form-scroll-body">
                    <div class="form-section-card">
                        <div class="form-section-title"><span>Método</span></div>
                        <div class="form-group">
                            <label for="method-selector">Método numérico</label>
                            <div class="select-wrapper">
                                <select id="method-selector" name="method">
                                    <optgroup label="Sistemas directos">
                                        <option value="gauss">Eliminación de Gauss</option>
                                        <option value="gauss-jordan">Gauss-Jordan</option>
                                        <option value="lu">Factorización LU</option>
                                        <option value="cholesky">Cholesky</option>
                                        <option value="inverse">Inversa</option>
                                        <option value="cramer">Cramer</option>
                                    </optgroup>
                                    <optgroup label="Sistemas iterativos">
                                        <option value="jacobi">Jacobi</option>
                                        <option value="gauss-seidel">Gauss-Seidel</option>
                                    </optgroup>
                                    <optgroup label="Sistemas no lineales">
                                        <option value="newton-system">Newton para sistemas</option>
                                        <option value="fixed-point-system">Punto fijo para sistemas</option>
                                    </optgroup>
                                    <optgroup label="Interpolación">
                                        <option value="lagrange">Lagrange</option>
                                        <option value="newton-divided">Newton, diferencias divididas</option>
                                    </optgroup>
                                    <optgroup label="Ajuste de curvas">
                                        <option value="regression-poly">Regresión polinomial</option>
                                        <option value="regression-multiple">Regresión múltiple</option>
                                    </optgroup>
                                </select>
                            </div>
                        </div>
                        <div id="example-list" class="example-row"></div>
                        <div id="dynamic-parameters"></div>
                    </div>
                </div>
                <div class="form-actions-sticky">
                    <button type="submit" class="btn-primary">Resolver</button>
                    <button type="button" id="btn-clear" class="btn-secondary">Limpiar</button>
                </div>
            </form>
        </aside>
        <section class="panel-right">
            <div id="preview-section" class="preview-section">
                <div class="preview-header">
                    <div class="preview-header-info">
                        <h3>Antes de resolver</h3>
                        <p id="method-help" class="method-help"></p>
                    </div>
                </div>
            </div>
            <div id="results-container" class="results-container hidden">
                <div class="tabs">
                    <div class="tab-headers" role="tablist">
                        <button class="tab-btn active" type="button" data-tab="tab-summary">Resumen</button>
                        <button class="tab-btn" type="button" data-tab="tab-graph">Gráfica</button>
                        <button class="tab-btn" type="button" data-tab="tab-table">Tabla</button>
                        <button class="tab-btn" type="button" data-tab="tab-code">Código Octave</button>
                    </div>
                    <div class="tab-content-container">
                        <div id="tab-summary" class="tab-content active"></div>
                        <div id="tab-graph" class="tab-content hidden">
                            <div class="tab-graph-header">
                                <h3>Gráfica</h3>
                                <div class="graph-toolbar" data-target="plotly-canvas">
                                    <button type="button" class="graph-toolbar-btn" data-action="zoom-in" aria-label="Acercar">+</button>
                                    <button type="button" class="graph-toolbar-btn" data-action="zoom-out" aria-label="Alejar">−</button>
                                    <button type="button" class="graph-toolbar-btn" data-action="reset" aria-label="Restablecer">↺</button>
                                    <button type="button" class="graph-toolbar-btn" data-action="download" aria-label="Descargar">↓</button>
                                </div>
                            </div>
                            <div id="plotly-canvas" class="plotly-canvas"></div>
                        </div>
                        <div id="tab-table" class="tab-content hidden"></div>
                        <div id="tab-code" class="tab-content hidden"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <section id="view-compare" class="view-container hidden compare-view">
        <h2 class="compare-view-title">Comparar</h2>
        <div id="compare-host"></div>
    </section>

    <section id="view-history" class="view-container hidden" style="padding: 2rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
            <h2>Historial de ejercicios</h2>
            <button id="btn-clear-history" class="btn-secondary" type="button">Limpiar historial</button>
        </div>
        <div id="history-list" style="display:flex;flex-direction:column;gap:1rem;"></div>
    </section>

    <dialog id="confirm-modal">
        <div class="modal-content-inner">
            <h3 id="modal-title">¿Eliminar?</h3>
            <p id="modal-message"></p>
            <div class="modal-actions" style="display:flex;gap:1rem;margin-top:1.5rem;justify-content:flex-end;">
                <button id="modal-btn-cancel" class="btn-secondary" type="button">Cancelar</button>
                <button id="modal-btn-confirm" class="btn-primary" type="button">Eliminar</button>
            </div>
        </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
